name: Docker build and push
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: docker build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image tag
        id: image
        run: |
          version=$(sed -n 's/^ARG EPGSTATION_VERSION=v//p' Dockerfile)
          test -n "$version"
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASS }}

      # 既存タグがあってもDockerfileの修正を公開できるよう、pushごとに再ビルドする。
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            yasuoza/epgstation:latest
            yasuoza/epgstation:${{ steps.image.outputs.tag }}
          build-args: |
            CPUCORE=4
          cache-from: type=gha,scope=epgstation-amd64
          cache-to: type=gha,mode=max,scope=epgstation-amd64
